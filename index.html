}

}
/* Bannières verticales */
.side-banner{
    position: fixed;
    top: 0;
    width: 120px; /* largeur */

    background-size: cover;
    background-position: center;
    z-index: -1;
}

        linear-gradient(to right, rgba(30,30,47,0) 0%, rgba(30,30,47,0.95) 100%),

}

.right-banner{

    background-position: center;
}
.side-banner{
    position: fixed;
    top: 0;
    width: 120px;
    height: 100vh;
    z-index: -1;
    filter: brightness(0.75);
}
